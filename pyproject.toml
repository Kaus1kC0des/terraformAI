[project]
name = "terraformai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.16.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "typer[all]>=0.27.2",
]

[project.scripts]
tfai = "tfai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfai", "src/tf_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
